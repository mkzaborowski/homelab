apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-opener
  labels:
    app: gate-opener
spec:
  # Must stay 1: the armed command lives in process memory, so a second replica
  # would answer /command without knowing about a POST the first one received.
  replicas: 1
  selector:
    matchLabels:
      app: gate-opener
  template:
    metadata:
      labels:
        app: gate-opener
    spec:
      containers:
        - name: gate-opener
          image: ghcr.io/mkzaborowski/gate-opener:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: COMMAND_TTL
              value: "1.5"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
