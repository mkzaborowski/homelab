name: gate-opener image

on:
  push:
    branches: [main]
    paths:
      - "gate-opener/**"
      - ".github/workflows/gate-opener.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gate-opener
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=semver,pattern={{version}}      # tag gita v1.0.0 -> obraz :1.0.0

      - uses: docker/build-push-action@v6
        with:
          context: ./gate-opener
          push: true
          # Serwer jest x86_64 - obraz MUSI być amd64. Bez tego build na Macu
          # (arm64) kończy się na serwerze pętlą "exec format error".
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
